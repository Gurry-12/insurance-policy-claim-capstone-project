# Test profile: relax rate limits that the integration tests must stay under,
# while keeping the login group low so the 429 behaviour can be exercised.
app.security.rate-limit.login.capacity=5
app.security.rate-limit.login.refill-per-minute=5

app.security.rate-limit.otp.capacity=1000
app.security.rate-limit.otp.refill-per-minute=1000

app.security.rate-limit.forgot.capacity=1000
app.security.rate-limit.forgot.refill-per-minute=1000

app.security.rate-limit.reset.capacity=1000
app.security.rate-limit.reset.refill-per-minute=1000

app.security.rate-limit.register.capacity=1000
app.security.rate-limit.register.refill-per-minute=1000

app.security.rate-limit.refresh.capacity=1000
app.security.rate-limit.refresh.refill-per-minute=1000

app.security.max-otp-attempts=5

# Disable Redis in integration tests to test DB-backed family revocation directly
app.security.redis.enabled=false
