spring.application.name=insurance-policy-claim-management-system

spring.config.import=file:env.properties

spring.datasource.url=jdbc:mysql://localhost:3306/insurance_db

spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}


spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true


server.port=8081

springdoc.swagger-ui.path=/swagger-ui.html

logging.level.root=INFO
logging.level.com.insurance.demo=INFO

# JWT / security configuration (centralized)
app.security.jwt.secret=${JWT_KEY}

app.security.jwt.expiration-ms=900000
#app.security.jwt.expiration-ms=60000

app.security.jwt.issuer=insurance-policy-claim-management-system

app.security.jwt.clock-skew-seconds=30

# Refresh token (opaque, SHA-256 hashed in DB, delivered via HttpOnly cookie)
app.security.jwt.refresh-token-ttl-days=7
# Set REFRESH_COOKIE_SECURE=true when the app is served over HTTPS in production.
app.security.jwt.refresh-cookie-secure=${REFRESH_COOKIE_SECURE:false}

# Rate limiting (Bucket4j) - capacity + refill per minute per endpoint group
app.security.rate-limit.login.capacity=5
app.security.rate-limit.login.refill-per-minute=5

app.security.rate-limit.otp.capacity=5
app.security.rate-limit.otp.refill-per-minute=5

app.security.rate-limit.forgot.capacity=3
app.security.rate-limit.forgot.refill-per-minute=3

app.security.rate-limit.reset.capacity=5
app.security.rate-limit.reset.refill-per-minute=5

app.security.rate-limit.register.capacity=5
app.security.rate-limit.register.refill-per-minute=5

app.security.rate-limit.refresh.capacity=10
app.security.rate-limit.refresh.refill-per-minute=10

app.security.max-otp-attempts=5

# Single CORS origin (the frontend) and the frontend base URL used in emailed
# links. Set the real values via the gitignored env.properties in deployed
# environments so no origin/URL is committed.
app.security.cors.allowed-origin=${CORS_ALLOWED_ORIGIN:http://localhost:5173}

app.security.seed-admin.enabled=true

app.security.swagger-enabled=true


cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME}
cloudinary.api-key=${CLOUDINARY_API_KEY}
cloudinary.api-secret=${CLOUDINARY_SECRET}

spring.servlet.multipart.enabled=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# mail 
spring.mail.host=smtp.gmail.com
spring.mail.port=587
spring.mail.username=${EMAIL_USER}
spring.mail.password=${EMAIL_PASSWORD}

spring.mail.protocol=smtp
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.properties.mail.smtp.ssl.trust=smtp.gmail.com

spring.mail.properties.mail.smtp.connectiontimeout=10000
spring.mail.properties.mail.smtp.timeout=10000
spring.mail.properties.mail.smtp.writetimeout=10000

spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true

app.otp.expiry-minutes=5

# twilio
app.twilio.account-sid=${TWILIO_SID}
app.twilio.auth-token=${TWILIO_TOKEN}
app.twilio.from-phone=${TWILIO_PHONE}

app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# Redis configuration (Token Cache, JWT Blacklisting, Refresh Token Grace Window)
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
app.security.redis.enabled=${REDIS_ENABLED:true}
app.security.redis.grace-window-seconds=10
app.security.redis.jwt-blacklist-prefix=auth:jwt:blacklist:
app.security.redis.refresh-token-prefix=auth:refresh:
app.security.redis.grace-prefix=auth:refresh:grace:
